<!DOCTYPE html>
<html>
<head>
<title>SHA-256 Visualizer</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    text-align: center;
}

.container {
    width: 80%;
    margin: auto;
}

input, button {
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: #00c6ff;
    color: white;
    cursor: pointer;
}

.round-box {
    background: rgba(255,255,255,0.1);
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
    text-align: left;
}

.hash-box {
    background: black;
    padding: 15px;
    margin: 20px;
    border-radius: 10px;
    word-wrap: break-word;
}
</style>
</head>

<body>
<div class="container">

<h2>SHA-256 (64 Rounds Visualization)</h2>

<form method="POST">
    <input name="text" placeholder="Enter text">
    <button>Generate</button>
</form>

{% if result %}
<div class="hash-box">
    <h3>Final Hash:</h3>
    <p>{{ result }}</p>
</div>

<h3>64 Rounds:</h3>

{% for r in rounds %}
<div class="round-box">
    <b>Round {{ r.round }}</b><br>
    a={{ r.a }} | b={{ r.b }} | c={{ r.c }} | d={{ r.d }}<br>
    e={{ r.e }} | f={{ r.f }} | g={{ r.g }} | h={{ r.h }}
</div>
{% endfor %}

{% endif %}

</div>
</body>
</html>
