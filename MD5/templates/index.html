<!DOCTYPE html>
<html>
<head>
<title>MD5 Visualizer</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #0f2027, #2c5364);
    color: white;
    text-align: center;
}

.container {
    width: 85%;
    margin: auto;
}

input, button {
    padding: 10px;
    margin: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: #00d4ff;
    color: black;
    cursor: pointer;
}

.step-box {
    background: rgba(255,255,255,0.1);
    margin: 8px;
    padding: 10px;
    border-radius: 10px;
    text-align: left;
}

.final-box {
    background: black;
    padding: 15px;
    margin: 20px;
    border-radius: 10px;
    word-wrap: break-word;
}
</style>
</head>

<body>
<div class="container">

<h2>MD5 (64-Step Visualization)</h2>

<form method="POST">
    <input name="text" placeholder="Enter text">
    <button>Generate</button>
</form>

{% if result %}

<div class="final-box">
    <h3>Final MD5 Hash:</h3>
    <p>{{ result }}</p>
</div>

<h3>64 Steps:</h3>

{% for s in steps %}
<div class="step-box">
    <b>Step {{ s.step }}</b><br>
    A = {{ s.A }}<br>
    B = {{ s.B }}<br>
    C = {{ s.C }}<br>
    D = {{ s.D }}
</div>
{% endfor %}

{% endif %}

</div>
</body>
</html>
